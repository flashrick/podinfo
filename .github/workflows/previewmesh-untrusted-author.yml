name: PreviewMesh untrusted-author fixture

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create same-repository bot PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: test/previewmesh-acceptance-base
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="acceptance/untrusted-author-${GITHUB_RUN_ID}"
          git init fixture
          cd fixture
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${BASE_BRANCH}"
          git checkout --detach FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'untrusted-author acceptance fixture %s\n' "${GITHUB_RUN_ID}" > previewmesh-untrusted-author.md
          git add previewmesh-untrusted-author.md
          git commit -m 'test: create untrusted-author acceptance fixture'
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create --repo "${REPOSITORY}" --base "${BASE_BRANCH}" --head "${branch}" --title 'test: verify PreviewMesh rejects untrusted author' --body 'Temporary bot-authored same-repository PR for PreviewMesh acceptance. It will be closed and deleted after verification.'
